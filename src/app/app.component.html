<main class="signup-layout">
  <section class="brand-panel" aria-labelledby="page-title">
    <app-logo />
    <app-brand-banner />
    <app-operator-table />
  </section>

  <section class="form-panel" aria-labelledby="form-title">
    <div class="form-panel__header">
      <h2 id="form-title">New operator</h2>
      <p>All fields required</p>
    </div>

    <app-signup-form />

    <p class="login-prompt">Already an operator? <a href="#login">Log in</a></p>
  </section>

  <section class="success-view" aria-labelledby="success-title" hidden>
    <h2 id="success-title">Handshake complete</h2>
    <p>Your operator account is ready.</p>
    <a href="#login">Continue to log in</a>
  </section>
</main>
