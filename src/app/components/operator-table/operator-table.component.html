<section class="operator-status" aria-label="Account setup status">
  <div class="operator-status__header">
    <h2 id="operator-title">Operator ID</h2>
    <p>
      <span id="ready-count">0</span>
      <span id="separator">/</span>
      <span id="total-count">5</span>
      <span id="status-text">ready</span>
    </p>
  </div>
  <p class="operator-status__name" id="operator-name">Unassigned</p>

  <ul class="status-list">
    <li>
      <span id="callsign-field">Callsign</span>
      <span id="callsign-status">Pending</span>
    </li>
    <li>
      <span id="email-field">Email</span>
      <span id="email-status">Pending</span>
    </li>
    <li>
      <span id="password-field">Password</span>
      <span id="password-status">Pending</span>
    </li>
    <li>
      <span id="confirm-field">Confirm</span>
      <span id="confirm-status">Pending</span>
    </li>
    <li>
      <span id="terms-field">Terms</span>
      <span id="terms-status">Required</span>
    </li>
  </ul>
</section>
